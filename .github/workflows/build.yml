name: Build ERA Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Organize Android Folders
      run: |
        mkdir -p app/src/main/java/com/era/assistant
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/values

        # Safe move
        if [ -f ShakeDetectorService.kt ]; then mv -f ShakeDetectorService.kt app/src/main/java/com/era/assistant/; fi
        if [ -f EraAccessibilityService.kt ]; then mv -f EraAccessibilityService.kt app/src/main/java/com/era/assistant/; fi
        if [ -f accessibility_service_config.xml ]; then mv -f accessibility_service_config.xml app/src/main/res/xml/; fi
        if [ -f colors.xml ]; then mv -f colors.xml app/src/main/res/values/; fi
        if [ -f strings.xml ]; then mv -f strings.xml app/src/main/res/values/; fi
        if [ -f themes.xml ]; then mv -f themes.xml app/src/main/res/values/; fi

        # Ensure base XMLs exist
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">ERA AI</string>
            <string name="accessibility_description">ERA Super AI automation engine.</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/values/colors.xml
        <resources>
            <color name="black">#FF000000</color>
            <color name="neon_cyan">#00E5FF</color>
            <color name="dark_bg">#0A0E17</color>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/values/themes.xml
        <resources>
            <style name="Theme.EraAssistant" parent="android:Theme.Material.NoActionBar">
                <item name="android:statusBarColor">#060A12</item>
                <item name="android:navigationBarColor">#060A12</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:description="@string/accessibility_description"
            android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
            android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:notificationTimeout="100"
            android:canPerformGestures="true"
            android:canRetrieveWindowContent="true" />
        EOF

        # Manifest with Default Assistant (ASSIST) Support
        cat << 'MANIFEST' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.CAMERA" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_dialog_info"
                android:label="ERA AI"
                android:roundIcon="@android:drawable/ic_dialog_info"
                android:supportsRtl="true"
                android:theme="@style/Theme.EraAssistant">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:theme="@style/Theme.EraAssistant">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                    <intent-filter>
                        <action android:name="android.intent
