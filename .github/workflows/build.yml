name: Build ERA Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Project & Build APK
      run: |
        # Create directory structure
        mkdir -p app/src/main/java/com/era/assistant
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/values

        # Move existing files if present in repo root
        [ -f ShakeDetectorService.kt ] && mv -f ShakeDetectorService.kt app/src/main/java/com/era/assistant/
        [ -f EraAccessibilityService.kt ] && mv -f EraAccessibilityService.kt app/src/main/java/com/era/assistant/
        [ -f accessibility_service_config.xml ] && mv -f accessibility_service_config.xml app/src/main/res/xml/
        [ -f colors.xml ] && mv -f colors.xml app/src/main/res/values/
        [ -f strings.xml ] && mv -f strings.xml app/src/main/res/values/
        [ -f themes.xml ] && mv -f themes.xml app/src/main/res/values/

        # 1. Root settings.gradle
        cat << 'SETTINGS_GRADLE' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "ERA Assistant"
        include ':app'
        SETTINGS_GRADLE

        # 2. Root build.gradle
        cat << 'ROOT_GRADLE' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
        }
        plugins {
            id 'com.android.application' version '8.2.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
        }
        ROOT_GRADLE

        # 3. App build.gradle
        cat << 'APP_GRADLE' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.era.assistant'
            compileSdk 34

            defaultConfig {
                applicationId "com.era.assistant"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
                testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
            }

            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
            buildFeatures {
                compose true
            }
            composeOptions {
                kotlinCompilerExtensionVersion '1.5.4'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2023.10.01')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.ui:ui-graphics'
            implementation 'androidx.compose.ui:ui-tooling-preview'
            implementation 'androidx.compose.material3:material3'
            implementation 'androidx.compose.material:material-icons-extended'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        }
        APP_GRADLE

        # 4. Manifest with Default Assistant
        cat << 'MANIFEST' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.CAMERA" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_dialog_info"
                android:label="ERA AI"
                android:roundIcon="@android:drawable/ic_dialog_info"
                android:supportsRtl="true"
                android:theme="@style/Theme.EraAssistant">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:theme="@style/Theme.EraAssistant">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                    <intent-filter>
                        <action android:name="android.intent.action.ASSIST" />
                        <category android:name="android.intent.category.DEFAULT" />
                    </intent-filter>
                </activity>

                <service android:name=".ShakeDetectorService" android:enabled="true" android:exported="false" />

                <service
                    android:name=".EraAccessibilityService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>

            </application>
        </manifest>
        MANIFEST

        # 5. Engine with Gemini AI Brain, Apps & Flashlight (100% Intact)
        cat << 'KOTLIN_ENGINE' > app/src/main/java/com/era/assistant/EraAgentEngine.kt
        package com.era.assistant

        import android.content.Context
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.hardware.camera2.CameraManager
        import kotlinx.coroutines.CoroutineScope
        import kotlinx.coroutines.Dispatchers
        import kotlinx.coroutines.launch
        import okhttp3.MediaType.Companion.toMediaType
        import okhttp3.OkHttpClient
        import okhttp3.Request
        import okhttp3.RequestBody.Companion.toRequestBody
        import org.json.JSONArray
        import org.json.JSONObject

        object EraAgentEngine {

            fun processCommand(
                context: Context,
                command: String,
                geminiApiKey: String,
                personality: String,
                onResponse: (String, String) -> Unit
            ) {
                val lower = command.lowercase().trim()

                if (lower == "hira" || lower == "era" || lower.startsWith("hello") || lower.startsWith("hi")) {
                    val reply = when (personality) {
                        "Jarvis" -> "At your service, sir. All systems running optimal."
                        "Tactical" -> "ERA online. Status: operational. Awaiting command."
                        else -> "Hello! I am ERA, your personal super AI. Tell me what to do!"
                    }
                    onResponse("ERA", reply)
                    return
                }

                if (lower.startsWith("open ") || lower.startsWith("launch ") || lower.contains("whatsapp") || lower.contains("youtube") || lower.contains("camera")) {
                    val appQuery = lower.removePrefix("open ").removePrefix("launch ").trim()
                    val targetName = when {
                        lower.contains("whatsapp") -> "whatsapp"
                        lower.contains("youtube") -> "youtube"
                        lower.contains("chrome") -> "chrome"
                        lower.contains("camera") -> "camera"
                        lower.contains("instagram") -> "instagram"
                        lower.contains("settings") -> "settings"
                        else -> appQuery
                    }

                    val launched = launchApp(context, targetName)
                    if (launched) {
                        onResponse("System", "Opening $targetName.")
                        return
                    }
                }

                if (lower.contains("torch") || lower.contains("flashlight")) {
                    val enable = !lower.contains("off")
                    toggleTorch(context, enable)
                    onResponse("System", if (enable) "Torch turned ON." else "Torch turned OFF.")
                    return
                }

                when {
                    lower.contains("home") -> {
                        EraAccessibilityService.instance?.pressHome()
                        onResponse("System", "Navigated Home.")
                        return
                    }
                    lower.contains("back") -> {
                        EraAccessibilityService.instance?.pressBack()
                        onResponse("System", "Navigated Back.")
                        return
                    }
                    lower.contains("screenshot") -> {
                        EraAccessibilityService.instance?.takeScreenshot()
                        onResponse("System", "Captured screen.")
                        return
                    }
                    lower.contains("notification") -> {
                        EraAccessibilityService.instance?.openNotifications()
                        onResponse("System", "Notifications opened.")
                        return
                    }
                }

                when {
                    lower.contains("deal") || lower.contains("price") || lower.contains("buy") || lower.contains("सस्ता") -> {
                        onResponse("DealHunter", "DealHunter active: Scanning Amazon & Flipkart for the lowest price.")
                        return
                    }
                    lower.contains("travel") || lower.contains("ticket") || lower.contains("train") || lower.contains("flight") -> {
                        onResponse("TravelVoyager", "TravelVoyager active: Checking route timings and hotel availability.")
                        return
                    }
                    lower.contains("read") || lower.contains("pdf") || lower.contains("summary") -> {
                        onResponse("DocuSense", "DocuSense active: Reading screen context and generating summary.")
                        return
                    }
                }

                if (geminiApiKey.isNotBlank()) {
                    callGeminiApi(command, geminiApiKey, personality) { responseText ->
                        onResponse("GeminiBrain", responseText)
                    }
                    return
                }

                onResponse("ERA", "Task received: '$command'. Processing now.")
            }

            private fun callGeminiApi(prompt: String, apiKey: String, personality: String, callback: (String) -> Unit) {
                CoroutineScope(Dispatchers.IO).launch {
                    try {
                        val client = OkHttpClient()
                        val url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey"

                        val systemInstruction = when (personality) {
                            "Jarvis" -> "You are ERA, an advanced female AI assistant inspired by Jarvis. Speak concisely, with British intelligence and poise."
                            "Tactical" -> "You are ERA, a tactical military HUD AI. Keep answers ultra-concise, under 2 sentences."
                            else -> "You are ERA, a friendly, witty, highly intelligent female AI assistant. Keep responses concise and conversational."
                        }

                        val jsonBody = JSONObject().apply {
                            put("contents", JSONArray().apply {
                                put(JSONObject().apply {
                                    put("parts", JSONArray().apply {
                                        put(JSONObject().apply {
                                            put("text", "$systemInstruction User asks: $prompt")
                                        })
                                    })
                                })
                            })
                        }

                        val mediaType = "application/json; charset=utf-8".toMediaType()
                        val requestBody = jsonBody.toString().toRequestBody(mediaType)
                        val request = Request.Builder().url(url).post(requestBody).build()

                        val response = client.newCall(request).execute()
                        if (response.isSuccessful) {
                            val respStr = response.body?.string() ?: ""
                            val root = JSONObject(respStr)
                            val candidates = root.optJSONArray("candidates")
                            val firstCandidate = candidates?.optJSONObject(0)
                            val content = firstCandidate?.optJSONObject("content")
                            val parts = content?.optJSONArray("parts")
                            val text = parts?.optJSONObject(0)?.optString("text", "Task completed.") ?: "Task completed."
                            callback(text.trim())
                        } else {
                            callback("AI Brain returned status: ${response.code}")
                        }
                    } catch (e: Exception) {
                        callback("Could not connect to Gemini Brain: ${e.message}")
                    }
                }
            }

            private fun launchApp(context: Context, appName: String): Boolean {
                val pm = context.packageManager
                val knownPackages = mapOf(
                    "whatsapp" to "com.whatsapp",
                    "youtube" to "com.google.android.youtube",
                    "chrome" to "com.android.chrome",
                    "camera" to "com.google.android.GoogleCamera",
                    "instagram" to "com.instagram.android",
                    "facebook" to "com.facebook.katana",
                    "settings" to "com.android.settings",
                    "maps" to "com.google.android.apps.maps",
                    "photos" to "com.google.android.apps.photos"
                )

                val pkgName = knownPackages[appName]
                if (pkgName != null) {
                    val intent = pm.getLaunchIntentForPackage(pkgName)
                    if (intent != null) {
                        intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                        context.startActivity(intent)
                        return true
                    }
                }

                val installed = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                for (app in installed) {
                    val label = pm.getApplicationLabel(app).toString()
                    if (label.contains(appName, ignoreCase = true)) {
                        val intent = pm.getLaunchIntentForPackage(app.packageName)
                        if (intent != null) {
                            intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                            context.startActivity(intent)
                            return true
                        }
                    }
                }
                return false
            }

            private fun toggleTorch(context: Context, enable: Boolean) {
                try {
                    val camManager = context.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                    val cameraId = camManager.cameraIdList[0]
                    camManager.setTorchMode(cameraId, enable)
                } catch (e: Exception) {
                    e.printStackTrace()
                }
            }
        }
        KOTLIN_ENGINE

        # 6. MainActivity with Complete Sci-Fi HUD, Themes & Settings UI (100% Intact)
        cat << 'KOTLIN_MAIN' > app/src/main/java/com/era/assistant/MainActivity.kt
        package com.era.assistant

        import android.content.Context
        import android.content.Intent
        import android.os.Bundle
        import android.speech.RecognitionListener
        import android.speech.RecognizerIntent
        import android.speech.SpeechRecognizer
        import android.speech.tts.TextToSpeech
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.background
        import androidx.compose.foundation.border
        import androidx.compose.foundation.clickable
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.rememberScrollState
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.foundation.verticalScroll
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.Mic
        import androidx.compose.material.icons.filled.MicOff
        import androidx.compose.material.icons.filled.Settings
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import java.util.*

        enum class SciFiTheme(val displayName: String, val primary: Color, val bg: Color, val boxBg: Color) {
            CYBER_CYAN("Cyber Cyan (Jarvis)", Color(0xFF00E5FF), Color(0xFF060A12), Color(0xFF0D1424)),
            QUANTUM_PURPLE("Quantum Purple", Color(0xFFD500F9), Color(0xFF0B0612), Color(0xFF170C24)),
            MATRIX_GREEN("Matrix Green", Color(0xFF00E676), Color(0xFF040A06), Color(0xFF09140C)),
            SOLAR_GOLD("Solar Gold (Friday)", Color(0xFFFFD600), Color(0xFF0E0B04), Color(0xFF1E1708))
        }

        class MainActivity : ComponentActivity(), TextToSpeech.OnInitListener {

            private var speechRecognizer: SpeechRecognizer? = null
            private var textToSpeech: TextToSpeech? = null
            private val isListening = mutableStateOf(false)
            private val terminalLogs = mutableStateListOf<String>()
            private val lastCommand = mutableStateOf("Ready for commands...")

            private val currentTheme = mutableStateOf(SciFiTheme.CYBER_CYAN)
            private val selectedVoice = mutableStateOf("Google India Female")
            private val geminiApiKey = mutableStateOf("")
            private val elevenApiKey = mutableStateOf("")
            private val aiPersonality = mutableStateOf("Friendly")
            private val voicePitch = mutableStateOf(1.22f)
            private val voiceSpeed = mutableStateOf(0.95f)

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                startService(Intent(this, ShakeDetectorService::class.java))

                val prefs = getSharedPreferences("era_prefs", Context.MODE_PRIVATE)
                val themeName = prefs.getString("theme", SciFiTheme.CYBER_CYAN.name)
                currentTheme.value = SciFiTheme.valueOf(themeName ?: SciFiTheme.CYBER_CYAN.name)
                selectedVoice.value = prefs.getString("voice", "Google India Female") ?: "Google India Female"
                geminiApiKey.value = prefs.getString("gemini_key", "") ?: ""
                elevenApiKey.value = prefs.getString("eleven_key", "") ?: ""
                aiPersonality.value = prefs.getString("personality", "Friendly") ?: "Friendly"
                voicePitch.value = prefs.getFloat("pitch", 1.22f)
                voiceSpeed.value = prefs.getFloat("speed", 0.95f)

                textToSpeech = TextToSpeech(this, this)
                setupSpeechRecognizer()

                setContent {
                    var showSettings by remember { mutableStateOf(false) }

                    Box(modifier = Modifier.fillMaxSize()) {
                        EraHudDashboard(
                            theme = currentTheme.value,
                            isListening = isListening.value,
                            logs = terminalLogs,
                            statusText = lastCommand.value,
                            onMicClick = { toggleListening() },
                            onSettingsClick = { showSettings = true }
                        )

                        if (showSettings) {
                            EraSettingsDialog(
                                currentTheme = currentTheme.value,
                                onThemeChange = { newTheme ->
                                    currentTheme.value = newTheme
                                    prefs.edit().putString("theme", newTheme.name).apply()
                                },
                                selectedVoice = selectedVoice.value,
                                onVoiceChange = { v ->
                                    selectedVoice.value = v
                                    prefs.edit().putString("voice", v).apply()
                                },
                                geminiKey = geminiApiKey.value,
                                onGeminiKeyChange = { k ->
                                    geminiApiKey.value = k
                                    prefs.edit().putString("gemini_key", k).apply()
                                },
                                elevenKey = elevenApiKey.value,
                                onElevenKeyChange = { k ->
                                    elevenApiKey.value = k
                                    prefs.edit().putString("eleven_key", k).apply()
                                },
                                personality = aiPersonality.value,
                                onPersonalityChange = { p ->
                                    aiPersonality.value = p
                                    prefs.edit().putString("personality", p).apply()
                                },
                                pitch = voicePitch.value,
                                onPitchChange = { pt ->
                                    voicePitch.value = pt
                                    prefs.edit().putFloat("pitch", pt).apply()
                                    textToSpeech?.setPitch(pt)
                                },
                                speed = voiceSpeed.value,
                                onSpeedChange = { spd ->
                                    voiceSpeed.value = spd
                                    prefs.edit().putFloat("speed", spd).apply()
                                    textToSpeech?.setSpeechRate(spd)
                                },
                                onClose = { showSettings = false }
                            )
                        }
                    }
                }
            }

            private fun toggleListening() {
                if (isListening.value) {
                    speechRecognizer?.stopListening()
                    isListening.value = false
                } else {
                    val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                        putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                        putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-IN")
                    }
                    speechRecognizer?.startListening(intent)
                    isListening.value = true
                }
            }

            private fun setupSpeechRecognizer() {
                speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this).apply {
                    setRecognitionListener(object : RecognitionListener {
                        override fun onReadyForSpeech(params: Bundle?) {}
                        override fun onBeginningOfSpeech() { isListening.value = true }
                        override fun onRmsChanged(rmsdB: Float) {}
                        override fun onBufferReceived(buffer: ByteArray?) {}
                        override fun onEndOfSpeech() { isListening.value = false }
                        override fun onError(error: Int) { isListening.value = false }
                        override fun onResults(results: Bundle?) {
                            isListening.value = false
                            val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                            if (!matches.isNullOrEmpty()) {
                                val command = matches[0]
                                lastCommand.value = command
                                terminalLogs.add("User: $command")
                                EraAgentEngine.processCommand(
                                    this@MainActivity,
                                    command,
                                    geminiApiKey.value,
                                    aiPersonality.value
                                ) { sender, response ->
                                    terminalLogs.add("$sender: $response")
                                    textToSpeech?.speak(response, TextToSpeech.QUEUE_FLUSH, null, null)
                                }
                            }
                        }
                        override fun onPartialResults(partialResults: Bundle?) {}
                        override fun onEvent(eventType: Int, params: Bundle?) {}
                    })
                }
            }

            override fun onInit(status: Int) {
                if (status == TextToSpeech.SUCCESS) {
                    textToSpeech?.language = Locale("en", "IN")
                    textToSpeech?.setPitch(voicePitch.value)
                    textToSpeech?.setSpeechRate(voiceSpeed.value)
                }
            }

            override fun onDestroy() {
                super.onDestroy()
                speechRecognizer?.destroy()
                textToSpeech?.stop()
                textToSpeech?.shutdown()
            }
        }

        @Composable
        fun EraHudDashboard(
            theme: SciFiTheme,
            isListening: Boolean,
            logs: List<String>,
            statusText: String,
            onMicClick: () -> Unit,
            onSettingsClick: () -> Unit
        ) {
            Surface(
                modifier = Modifier.fillMaxSize(),
                color = theme.bg
            ) {
                Column(
                    modifier = Modifier
                        .fillMaxSize()
                        .padding(16.dp)
                        .verticalScroll(rememberScrollState()),
                    horizontalAlignment = Alignment.CenterHorizontally
                ) {
                    Row(
                        modifier = Modifier.fillMaxWidth(),
                        horizontalArrangement = Arrangement.SpaceBetween,
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Text(
                            text = "ERA ASSISTANT HUD",
                            color = theme.primary,
                            fontSize = 20.sp,
                            fontWeight = FontWeight.Bold
                        )
                        IconButton(onClick = onSettingsClick) {
                            Icon(Icons.Default.Settings, contentDescription = "Settings", tint = theme.primary)
                        }
                    }

                    Spacer(modifier = Modifier.height(20.dp))

                    Box(
                        modifier = Modifier
                            .size(120.dp)
                            .border(2.dp, theme.primary, RoundedCornerShape(60.dp))
                            .background(theme.boxBg, RoundedCornerShape(60.dp))
                            .clickable { onMicClick() },
                        contentAlignment = Alignment.Center
                    ) {
                        Icon(
                            imageVector = if (isListening) Icons.Default.Mic else Icons.Default.MicOff,
                            contentDescription = "Mic",
                            tint = theme.primary,
                            modifier = Modifier.size(48.dp)
                        )
                    }

                    Spacer(modifier = Modifier.height(16.dp))
                    Text(
                        text = if (isListening) "Listening..." else "Tap mic or speak command",
                        color = theme.primary,
                        fontSize = 14.sp
                    )

                    Spacer(modifier = Modifier.height(20.dp))
                    Card(
                        modifier = Modifier.fillMaxWidth(),
                        colors = CardDefaults.cardColors(containerColor = theme.boxBg)
                    ) {
                        Column(modifier = Modifier.padding(12.dp)) {
                            Text(text = "Status: $statusText", color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                        }
                    }

                    Spacer(modifier = Modifier.height(20.dp))

                    Column(
                        modifier = Modifier
                            .fillMaxWidth()
                            .background(theme.boxBg, RoundedCornerShape(8.dp))
                            .padding(12.dp)
                    ) {
                        Text(text = "System Logs:", color = theme.primary, fontWeight = FontWeight.Bold)
                        Spacer(modifier = Modifier.height(8.dp))
                        for (log in logs) {
                            Text(text = log, color = Color.LightGray, fontSize = 13.sp)
                            Spacer(modifier = Modifier.height(4.dp))
                        }
                    }
                }
            }
        }

        @Composable
        fun EraSettingsDialog(
            currentTheme: SciFiTheme,
            onThemeChange: (SciFiTheme) -> Unit,
            selectedVoice: String,
            onVoiceChange: (String) -> Unit,
            geminiKey: String,
            onGeminiKeyChange: (String) -> Unit,
            elevenKey: String,
            onElevenKeyChange: (String) -> Unit,
            personality: String,
            onPersonalityChange: (String) -> Unit,
            pitch: Float,
            onPitchChange: (Float) -> Unit,
            speed: Float,
            onSpeedChange: (Float) -> Unit,
            onClose: () -> Unit
        ) {
            AlertDialog(
                onDismissRequest = onClose,
                title = { Text("ERA Settings", color = currentTheme.primary) },
                text = {
                    Column(
                        modifier = Modifier
                            .fillMaxWidth()
                            .verticalScroll(rememberScrollState())
                    ) {
                        Text("Select Theme", color = Color.White, fontWeight = FontWeight.Bold)
                        Spacer(modifier = Modifier.height(4.dp))
                        SciFiTheme.values().forEach { t ->
                            Button(
                                onClick = { onThemeChange(t) },
                                colors = ButtonDefaults.buttonColors(
                                    containerColor = if (t == currentTheme) t.primary else Color.DarkGray
                                ),
                                modifier = Modifier.fillMaxWidth().padding(vertical = 2.dp)
                            ) {
                                Text(t.displayName, color = Color.Black)
                            }
                        }

                        Spacer(modifier = Modifier.height(12.dp))
                        Text("Gemini API Key", color = Color.White, fontWeight = FontWeight.Bold)
                        OutlinedTextField(
                            value = geminiKey,
                            onValueChange = onGeminiKeyChange,
                            modifier = Modifier.fillMaxWidth(),
                            singleLine = true
                        )

                        Spacer(modifier = Modifier.height(12.dp))
                        Text("AI Personality", color = Color.White, fontWeight = FontWeight.Bold)
                        listOf("Friendly", "Jarvis", "Tactical").forEach { p ->
                            Button(
                                onClick = { onPersonalityChange(p) },
                                colors = ButtonDefaults.buttonColors(
                                    containerColor = if (p == personality) currentTheme.primary else Color.DarkGray
                                ),
                                modifier = Modifier.fillMaxWidth().padding(vertical = 2.dp)
                            ) {
                                Text(p, color = Color.Black)
                            }
                        }
                    }
                },
                confirmButton = {
                    TextButton(onClick = onClose) {
                        Text("Close", color = currentTheme.primary)
                    }
                }
            )
        }
        KOTLIN_MAIN

        # Generate Gradle Wrapper & Build APK
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
