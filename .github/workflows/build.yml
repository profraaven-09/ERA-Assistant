name: Build ERA Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Organize Android Folders
      run: |
        mkdir -p app/src/main/java/com/era/assistant
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/values

        [ -f MainActivity.kt ] && mv -f MainActivity.kt app/src/main/java/com/era/assistant/
        [ -f EraAccessibilityService.kt ] && mv -f EraAccessibilityService.kt app/src/main/java/com/era/assistant/
        [ -f EraAgentEngine.kt ] && mv -f EraAgentEngine.kt app/src/main/java/com/era/assistant/
        [ -f ShakeDetectorService.kt ] && mv -f ShakeDetectorService.kt app/src/main/java/com/era/assistant/
        [ -f AndroidManifest.xml ] && mv -f AndroidManifest.xml app/src/main/
        [ -f accessibility_service_config.xml ] && mv -f accessibility_service_config.xml app/src/main/res/xml/
        [ -f colors.xml ] && mv -f colors.xml app/src/main/res/values/
        [ -f strings.xml ] && mv -f strings.xml app/src/main/res/values/
        [ -f themes.xml ] && mv -f themes.xml app/src/main/res/values/

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "EraAssistant"
        include(":app")
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.era.assistant"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.era.assistant"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0.0"

                vectorDrawables {
                    useSupportLibrary = true
                }
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_1_8
                targetCompatibility = JavaVersion.VERSION_1_8
            }
            kotlinOptions {
                jvmTarget = "1.8"
            }
            buildFeatures {
                compose = true
            }
            composeOptions {
                kotlinCompilerExtensionVersion = "1.5.8"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
            implementation("androidx.activity:activity-compose:1.8.2")
            implementation(platform("androidx.compose:compose-bom:2024.02.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.ui:ui-tooling-preview")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
            implementation("com.squareup.okhttp3:okhttp:4.12.0")
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ERA-Assistant-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
